name: Daily System & Log Health Check

on:
  # Jadwal harian dinonaktifkan: runner GitHub tidak bisa menjangkau Joko (berjalan di
  # EC2/laptop pada 127.0.0.1), sehingga hasilnya selalu "PERLU PERHATIAN" palsu.
  # Pemeriksaan nyata: jalankan `node check-logs.mjs` di server Joko.
  workflow_dispatch: # Tetap bisa dijalankan manual lewat tombol "Run workflow"

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Jalankan Pemeriksaan Log Harian
        run: |
          node check-logs.mjs

      - name: Tampilkan Ringkasan di GitHub Actions
        run: |
          cat LAPORAN_LOG_HARIAN.md >> $GITHUB_STEP_SUMMARY

      - name: Simpan dan Commit Laporan Otomatis
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LAPORAN_LOG_HARIAN.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): perbarui LAPORAN_LOG_HARIAN.md [skip ci]" && git push)
